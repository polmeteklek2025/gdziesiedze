<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Przydział do stołów</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: "Georgia", serif;
    }

    body {
      text-align: center;
      background-image: url('tlo.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 50px 20px;
    }

    .logo {
      width: 180px;
      margin-top: 80px;
      opacity: 0.85;
    }

    .input-group {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 45px;
      width: 100%;
      max-width: 350px;
    }

    input {
      padding: 14px;
      font-size: 16px;
      flex-grow: 1;
      border: 2px solid #fff;
      border-radius: 4px 0 0 4px;
      outline: none;
      background-color: rgba(255, 255, 255, 0.9);
      color: #000;
      font-weight: bold;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    input:focus {
      border-color: #daa520;
      box-shadow: 0 0 10px 3px rgba(218, 165, 32, 0.8);
      background-color: #fff;
    }

    button {
      width: 48px;
      height: 48px;
      font-size: 20px;
      margin-left: 0;
      cursor: pointer;
      border: none;
      border-radius: 0 4px 4px 0;
      background-color: #444;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #666;
    }

    #result {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
      color: #000;
      background-color: rgba(255, 255, 255, 0.8);
      padding: 15px 20px;
      border-radius: 8px;
      max-width: 90%;
      word-wrap: break-word;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      position: relative;
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .table-image {
      width: 100px;
      margin-top: 20px;
    }

    /* Obrazek MENU – powiększony, wyśrodkowany i zakotwiczony na dole */
    .menu-image-container {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 100;
    }

    .menu-image-container img {
      width: 150px; /* powiększony obraz */
      opacity: 0.9;
      cursor: pointer;
      border-radius: 15px; /* zaokrąglone rogi */
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .menu-image-container img:hover {
      transform: scale(1.08);
      opacity: 1;
    }

    /* Styl przycisków grupy Julii Kot */
    .julia-group-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .julia-group-button {
      background: linear-gradient(145deg, #fffef5, #ffeaa0);
      color: black;
      font-family: "Georgia", serif;
      font-size: 20px;
      font-weight: bold;
      padding: 60px 40px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      min-width: 120px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .julia-group-button::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAgCAYAAABnrd7EAAAACXBIWXMAAAsSAAALEgHS3X78AAABIklEQVR42u2YwUoDQRBFz3RQhQSZiBUU5CCUQIqewU+QUPAHsD6IQkGJ0hIoCIiNQN9nTizO7+2Z79jz5+mVdvbcyiQQCBAAiQAAkAAJkAACRAAiQAAJkAACZAACZAAAkAACRAAiQAAJkAACZAAAkAAJkAACZAAAkAACRAAiQAAJkAACZAAAkAAJkAACRAAiQAAJkAACZAAAkAACZAAAkAAJkAACRAAiQAAJkAACZAAAkAAJkAACRAAiQAAJkAACZAAAkAAJkAACRAAiQAAJkAACZAACZAAAkAACRAAiQAAJkAACZAACZAAAkAAJkAAJkAACRAAiQAAJkAACZAACZAAAkAACRAAiQAAJkAACZAACZAAAkAACRAAiQAAJkAACZAACZAAAkAACRAAiQAAJkAACZAACZAAAkAACZAACZAAAkAACZAAAkAALkn5HhgR6fD7wAAAABJRU5ErkJggg==");
      background-repeat: repeat;
      opacity: 0.18;
      pointer-events: none;
    }

    .julia-group-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    @media (max-width: 500px) {
      .julia-group-container {
        flex-direction: column;
        align-items: center;
      }
      .julia-group-button {
        padding: 50px 30px;
        font-size: 18px;
      }
      .menu-image-container img {
        width: 120px;
      }
    }
  </style>

   function normalizeName(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function mapNicknameToFull(name) {
      return nicknameMap[name] || name;
    }

    function levenshtein(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i-1) === a.charAt(j-1)) {
            matrix[i][j] = matrix[i-1][j-1];
          } else {
            matrix[i][j] = Math.min(matrix[i-1][j-1]+1, matrix[i][j-1]+1, matrix[i-1][j]+1);
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function showJuliaKotTable(table, group) {
      showResult(`Witaj, <strong>Julia Kot</strong>!<br>Twój stół to numer <strong>${table}</strong>.<br>
                  <img src="stol.png" alt="Stół" class="table-image">`);
    }

    function showResult(html) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = html;
      resultDiv.classList.add('show');
      setTimeout(() => resultDiv.classList.remove('show'), 8000);
    }

    function findTable() {
      const input = document.getElementById('guestName');
      const rawInput = input.value.trim();
      const nameInput = normalizeName(rawInput);
      const resultDiv = document.getElementById('result');

      input.blur();

      if (!nameInput) {
        showResult("Proszę wpisać imię i nazwisko lub nazwisko.");
        return;
      }

      if (nameInput === "julia kot") {
        let html = `<div class="julia-group-container">`;
        juliaKotData.forEach(entry => {
          html += `<button class="julia-group-button" 
                       onclick="showJuliaKotTable(${entry.table}, ${entry.group})">
                       Grupa ${entry.group}
                   </button>`;
        });
        html += `</div>`;
        resultDiv.innerHTML = html;
        resultDiv.classList.add('show');
        return;
      }

      const inputWords = nameInput.split(/\s+/).filter(Boolean);

      if (inputWords.length === 1) {
        const lastName = inputWords[0];
        const matches = [];

        for (const [name, table] of Object.entries(guests)) {
          const normalizedFull = normalizeName(name);
          const parts = normalizedFull.split(" ");
          if (parts.length < 2) continue;
          const fullLast = parts[1];
          const distance = levenshtein(fullLast, lastName);
          if (distance <= 2) matches.push([name, table]);
        }

        if (matches.length === 1) {
          const [foundName, foundTable] = matches[0];
          showResult(`Witaj, <strong>${foundName}</strong>! Twój stół to numer <strong>${foundTable}</strong>.<br>
            <img src="stol.png" alt="Stół" class="table-image">`);
          return;
        } else if (matches.length > 1) {
          let html = `<div class="julia-group-container">`;
          matches.forEach(([name, table]) => {
            html += `<button class="julia-group-button" 
                         onclick="showResult('Witaj, <strong>${name}</strong>! Twój stół to numer <strong>${table}</strong>.<br><img src=\\'stol.png\\' alt=\\'Stół\\' class=\\'table-image\\'>')">
                         ${name}
                     </button>`;
          });
          html += `</div>`;
          resultDiv.innerHTML = html;
          resultDiv.classList.add('show');
          return;
        } else {
          showResult("Nie znaleziono gościa o podanym nazwisku.");
          return;
        }
      }

      if (inputWords.length >= 2) {
        let [inputFirst, inputLast] = inputWords;
        inputFirst = mapNicknameToFull(inputFirst);

        for (const [name, table] of Object.entries(guests)) {
          const normalizedFull = normalizeName(name);
          const [fullFirst, fullLast] = normalizedFull.split(" ");
          if (mapNicknameToFull(fullFirst) === inputFirst && fullLast === inputLast) {
            showResult(`Witaj, <strong>${name}</strong>! Twój stół to numer <strong>${table}</strong>.<br>
              <img src="stol.png" alt="Stół" class="table-image">`);
            return;
          }
        }

        let bestMatch = null;
        let bestScore = Infinity;

        for (const [name, table] of Object.entries(guests)) {
          const normalizedName = normalizeName(name);
          const nameParts = normalizedName.split(/\s+/);
          if (nameParts.length < 2) continue;
          let [first, last] = nameParts;
          first = mapNicknameToFull(first);
          const firstDistance = levenshtein(first, inputFirst);
          const lastDistance = levenshtein(last, inputLast);
          const weightedScore = firstDistance * 1 + lastDistance * 2;

          if (weightedScore < bestScore) {
            bestScore = weightedScore;
            bestMatch = [name, table];
          }
        }

        if (bestMatch && bestScore <= 4) {
          showResult(`Witaj, <strong>${bestMatch[0]}</strong>! Twój stół to numer <strong>${bestMatch[1]}</strong>.<br>
            <img src="stol.png" alt="Stół" class="table-image">`);
        } else {
          showResult("Nie znaleziono gościa o podanym imieniu i nazwisku.");
        }
      }
    }
